name: Simplify aggregate tables
on:
  push:
    branches: [main]
    paths: ['.github/workflows/simplify-aggregate-tables.yml']
permissions:
  contents: write
jobs:
  simplify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Apply previously validated column projection
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = "e10d6104cb82ec4d4dc539fe1ad22563df7f39b3"
          python - <<'PY'
          import subprocess
          import textwrap
          source = subprocess.check_output([
              'git', 'show',
              'e10d6104cb82ec4d4dc539fe1ad22563df7f39b3:.github/workflows/simplify-aggregate-tables.yml'
          ], text=True)
          start = "          python - <<'PY'\n"
          end = "          PY\n"
          if source.count(start) != 1:
              raise SystemExit('Expected exactly one reviewed transformation script')
          body = source.split(start, 1)[1].split(end, 1)[0]
          exec(compile(textwrap.dedent(body), '<reviewed-table-projection>', 'exec'))
          PY
          python scripts/validate_dataset.py
      - name: Publish simplified tables
        shell: bash
        env:
          GIT_AUTHOR_NAME: yuetianluNLP
          GIT_AUTHOR_EMAIL: yuetianlu@cis.lmu.de
          GIT_COMMITTER_NAME: yuetianluNLP
          GIT_COMMITTER_EMAIL: yuetianlu@cis.lmu.de
        run: |
          set -euo pipefail
          git add data/01_main_results/source_tables/appendix_natural_accuracy_points.csv data/01_main_results/source_tables/figure1_points.csv data/02_error_plausibility/plausibility_vs_linearity_correlations.csv data/DATA_INDEX.md scripts/validate_dataset.py
          git -c core.whitespace=blank-at-eol,blank-at-eof,space-before-tab,cr-at-eol diff --cached --check
          git diff --cached --stat
          git commit -m "Simplify aggregate-table columns and data index without changing results"
          git push origin HEAD:main
          printf 'Published commit: '
          git rev-parse HEAD
